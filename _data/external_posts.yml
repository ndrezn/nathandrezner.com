  excerpt: "Restock is a sample office-supply agent that runs in Slack, builds a cart, and pays through Stripe's Link wallet. Payment credentials never reach the model, and every order needs approval in both Slack and Link. Co-written with Srimanth Tangedipalli and Sydney Runkle."
  url: "https://www.langchain.com/blog/agents-that-can-pay-with-stripe-link"
  tag: langchain

