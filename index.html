    <div id="temparature_montreal">
        <div></div>
        <script>
            var WMO = {
                0: 'clear', 1: 'mostly clear', 2: 'partly cloudy', 3: 'overcast',
                45: 'foggy', 48: 'foggy',
                51: 'drizzling', 53: 'drizzling', 55: 'drizzling',
                56: 'freezing drizzle', 57: 'freezing drizzle',
                61: 'rainy', 63: 'rainy', 65: 'rainy',
                66: 'freezing rain', 67: 'freezing rain',
                71: 'snowy', 73: 'snowy', 75: 'snowy', 77: 'snowy',
                80: 'showery', 81: 'showery', 82: 'showery',
                85: 'snowy', 86: 'snowy',
                95: 'stormy', 96: 'stormy', 99: 'stormy',
            };
            fetch(
                'https://api.open-meteo.com/v1/forecast?latitude=45.5582&longitude=-73.8516&current=temperature_2m,weather_code'
            )
                .then(function (r) {
                    return r.json();
                })
                .then(function (data) {
                    var desc = WMO[data.current.weather_code];
                    document.getElementById('temparature_montreal').textContent =
                        "It's " +
                        (desc ? desc + ' and ' : '') +
                        data.current.temperature_2m +
                        '°C in Tiohtià:ke (fr/en: Montréal).';
                })
                .catch(function () {});
        </script>
    </div>
